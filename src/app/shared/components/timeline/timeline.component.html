<div class="timeline">
    @for (item of items; track $index) {
    <div class="timeline-item">
        <div class="timeline-content">
            <label class="timeline-label">{{ item.label }}</label>
            @if (timelineContentTemplateRef) {
            <ng-container *ngTemplateOutlet="timelineContentTemplateRef;context:{item: item.data}">
            </ng-container>
            }
        </div>
    </div>
    }
</div>
