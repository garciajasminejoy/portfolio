<h3>Work History</h3>
<p>
    My roles and responsibilities throughout the years
</p>

<div class="timeline-container">
    <app-timeline [items]="workHistory" [timelineContentTemplateRef]="timelineItemTemplate"></app-timeline>
</div>

<ng-template #timelineItemTemplate let-item="item">
    <p>
        <b>{{item.name}}</b>
    </p>
    @if (item.description) {
    <p>{{ item.description }}</p>
    }
</ng-template>
