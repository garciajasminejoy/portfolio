<div class="tech-stack">
    <h3>My Tech Stack</h3>
    <p>Technologies I use. And some that i'm trying to learn. I won't tell you which is which :P</p>

    <div class="tech-list">
        @for (tech of list; track $index) {
            <div class="tech-list--item">
                <img src="images/icons/{{ tech.iconFileName }}" [alt]="tech.name" [title]="tech.name" width="70">
            </div>
        }
    </div>
</div>
